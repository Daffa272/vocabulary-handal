<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7ff">
  <title>Ruang Belajar &amp; Berkarya</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #69758b;
      --line: #e5eaf2;
      --primary: #5146e5;
      --surface: #fff;
      --page: #f5f7ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 12% 5%, #e9e7ff 0, transparent 34rem),
        radial-gradient(ellipse at 90% 30%, #e4f4ff 0, transparent 30rem),
        var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    a { color: inherit; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgb(255 255 255 / 88%);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      width: min(1120px, calc(100% - 40px));
      min-height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: var(--ink);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 850;
      letter-spacing: -.04em;
      white-space: nowrap;
    }

    .brand span { color: var(--primary); }

    .category-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 0;
    }

    .category-nav button,
    .category-card {
      font: inherit;
      cursor: pointer;
    }

    .category-nav button {
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: #4c5870;
      font-size: .9rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .category-nav button:hover,
    .category-nav button[aria-pressed="true"] {
      border-color: #dcd9ff;
      background: #f0efff;
      color: #4035c8;
    }

    .header-menu {
      display: none;
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 0 0 14px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-menu.visible { display: flex; }

    .header-menu a {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: #46516a;
      font-size: .82rem;
      font-weight: 650;
      text-decoration: none;
    }

    .header-menu a:hover {
      border-color: #c9c4ff;
      color: #4035c8;
    }

    main {
      width: min(1000px, calc(100% - 40px));
      margin: 0 auto;
      padding: 76px 0 64px;
    }

    .intro { max-width: 680px; margin-bottom: 34px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--primary);
      font-size: .77rem;
      font-weight: 850;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 6vw, 4rem);
      line-height: 1.08;
      letter-spacing: -.065em;
    }

    .intro p:last-child {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .category-card {
      position: relative;
      min-height: 194px;
      padding: 23px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgb(255 255 255 / 91%);
      box-shadow: 0 12px 32px rgb(33 44 75 / 5%);
      color: var(--ink);
      text-align: left;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .category-card:hover,
    .category-card[aria-pressed="true"] {
      transform: translateY(-3px);
      border-color: #c8c3ff;
      box-shadow: 0 18px 36px rgb(57 48 155 / 11%);
    }

    .category-icon {
      display: grid;
      width: 48px;
      height: 48px;
      margin-bottom: 19px;
      place-items: center;
      border-radius: 15px;
      background: #f0efff;
      font-size: 1.45rem;
    }

    .category-card:nth-child(2) .category-icon { background: #fff2e9; }
    .category-card:nth-child(3) .category-icon { background: #eaf8f1; }

    .category-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1.15rem;
    }

    .category-card small { color: var(--muted); font-size: .88rem; }

    .category-card::after {
      position: absolute;
      top: 26px;
      right: 24px;
      color: #9ba4b5;
      content: "↗";
      font-size: 1.15rem;
    }

    .menu-panel {
      margin-top: 28px;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 14px 36px rgb(33 44 75 / 6%);
    }

    .menu-panel[hidden] { display: none; }

    .panel-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 19px;
    }

    .panel-heading h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.035em; }
    .panel-heading p { margin: 0; color: var(--muted); font-size: .9rem; }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .menu-link {
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: #344057;
      font-weight: 700;
      text-decoration: none;
      transition: border-color .15s ease, background .15s ease, color .15s ease;
    }

    .menu-link::after { color: #9ba4b5; content: "→"; }
    .menu-link:hover { border-color: #c8c3ff; background: #f8f7ff; color: #4035c8; }

    @media (max-width: 760px) {
      .header-inner { align-items: flex-start; flex-direction: column; gap: 5px; padding-top: 14px; }
      .category-nav { width: 100%; }
      main { padding-top: 48px; }
      .category-grid { grid-template-columns: 1fr; }
      .category-card { min-height: 150px; }
      .category-icon { margin-bottom: 12px; }
      .menu-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 480px) {
      .header-inner, .header-menu { width: min(100% - 28px, 1120px); }
      main { width: min(100% - 28px, 1000px); }
      .menu-panel { padding: 19px; }
      .panel-heading { align-items: flex-start; flex-direction: column; }
      .menu-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Beranda">Ruang<span>Belajar</span></a>
      <nav class="category-nav" aria-label="Pilih kategori">
        <button type="button" data-category="english" aria-pressed="false">Bahasa Inggris</button>
        <button type="button" data-category="work" aria-pressed="false">Pekerjaan</button>
        <button type="button" data-category="knowledge" aria-pressed="false">Keilmuan</button>
      </nav>
    </div>
    <nav class="header-menu" id="headerMenu" aria-label="Menu kategori terpilih"></nav>
  </header>

  <main>
    <section class="intro" aria-labelledby="pageTitle">
      <p class="eyebrow">Satu tempat untuk bertumbuh</p>
      <h1 id="pageTitle">Mau belajar apa hari ini?</h1>
      <p>Pilih kategori untuk melihat kumpulan alat belajar dan pekerjaan yang kamu butuhkan.</p>
    </section>

    <section class="category-grid" aria-label="Kategori utama">
      <button class="category-card" type="button" data-category="english" aria-pressed="false">
        <span class="category-icon" aria-hidden="true">🌍</span>
        <strong>Bahasa Inggris</strong>
        <small>Vocabulary, speaking, dan catatan harian</small>
      </button>
      <button class="category-card" type="button" data-category="work" aria-pressed="false">
        <span class="category-icon" aria-hidden="true">💼</span>
        <strong>Pekerjaan</strong>
        <small>Persiapan kerja, lamaran, dan dokumen</small>
      </button>
      <button class="category-card" type="button" data-category="knowledge" aria-pressed="false">
        <span class="category-icon" aria-hidden="true">📚</span>
        <strong>Keilmuan</strong>
        <small>Bahasa, materi, dan pengembangan diri</small>
      </button>
    </section>

    <section class="menu-panel" id="menuPanel" aria-live="polite" aria-labelledby="menuTitle" hidden>
      <div class="panel-heading">
        <h2 id="menuTitle"></h2>
        <p>Pilih menu untuk langsung membuka halaman.</p>
      </div>
      <div class="menu-grid" id="menuGrid"></div>
    </section>
  </main>

  <script>
    const categories = {
      english: {
        title: 'Bahasa Inggris',
        links: [
          ['Vocabulary', 'vocabulary.html'],
          ['Object English', 'objects.html'],
          ['Chunk Speak', 'chunk.html'],
          ['Jurnal Harian', 'journal.html'],
          ['Catatan', 'note.html']
        ]
      },
      work: {
        title: 'Pekerjaan',
        links: [
          ['Psikotest', 'psikotest.html'],
          ['FGD', 'fgd.html'],
          ['Convert', 'convert.html'],
          ['Tanya (DOD)', 'dod.html'],
          ['Lamaran Kerja', 'lamaran.html'],
          ['Transcript', 'transcript.html'],
          ['Jejak Data', 'jejak-data/index.html'],
          ['Financial Analysis Lab', 'financial/dist/index.html'],
          ['Power BI Academy', 'power-bi-academy-—-from-beginner-to-data-analyst (1)/dist/index.html'],
          ['Scraping & Ambil Data', 'scrapping/dist/index.html']
        ]
      },
      knowledge: {
        title: 'Keilmuan',
        links: [
          ['Vocabulary Mandarin', 'mandarin.html'],
          ['Material', 'material.html'],
          ['Supply', 'supply.html'],
          ['Public Speaking', 'publicspeaking.html'],
          ['Pranikah', 'pranikah.html']
        ]
      }
    };

    const panel = document.getElementById('menuPanel');
    const menuTitle = document.getElementById('menuTitle');
    const menuGrid = document.getElementById('menuGrid');
    const headerMenu = document.getElementById('headerMenu');

    function selectCategory(categoryKey) {
      const category = categories[categoryKey];
      if (!category) return;

      document.querySelectorAll('[data-category]').forEach((control) => {
        const selected = control.dataset.category === categoryKey;
        control.setAttribute('aria-pressed', String(selected));
      });

      menuTitle.textContent = category.title;
      menuGrid.replaceChildren();
      headerMenu.replaceChildren();

      category.links.forEach(([label, href]) => {
        const panelLink = document.createElement('a');
        panelLink.className = 'menu-link';
        panelLink.href = href;
        panelLink.textContent = label;
        menuGrid.appendChild(panelLink);

        const headerLink = document.createElement('a');
        headerLink.href = href;
        headerLink.textContent = label;
        headerMenu.appendChild(headerLink);
      });

      headerMenu.classList.add('visible');
      panel.hidden = false;
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    document.querySelectorAll('[data-category]').forEach((control) => {
      control.addEventListener('click', () => selectCategory(control.dataset.category));
    });
  </script>
</body>
</html>
